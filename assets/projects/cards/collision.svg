<text x="20" y="420" fill="#c9c9b9" font-family="monospace" font-size="14" letter-spacing="2">SPATIAL HOTSPOTS</text></g>
<g transform="translate(450 230)"><text x="0" y="0" fill="#c8d0b8" font-family="monospace" font-size="15" letter-spacing="3">TEMPORAL SIGNAL / MONTHLY</text><path d="M0 245H640M0 185H640M0 125H640M0 65H640" stroke="#8c9a7d" stroke-opacity=".25"/><path d="M0 210 48 190 96 205 144 142 192 160 240 112 288 130 336 75 384 95 432 44 480 78 528 38 576 60 624 18" fill="none" stroke="#d8ef96" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 210 48 190 96 205 144 142 192 160 240 112 288 130 336 75 384 95 432 44 480 78 528 38 576 60 624 18V245H0Z" fill="#d8ef96" fill-opacity=".08"/>
<g fill="#f1eee4" font-family="monospace" font-size="13"><text x="0" y="280">JAN</text><text x="190" y="280">APR</text><text x="380" y="280">JUL</text><text x="570" y="280">OCT</text></g></g>
