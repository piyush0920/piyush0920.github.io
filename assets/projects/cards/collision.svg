<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">California traffic collision data analysis</title><desc id="desc">A stylised California map grid with collision hotspot points, a time-series sparkline and data quality indicators.</desc>
<defs><pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#75836a" stroke-opacity=".22" stroke-width="1"/></pattern><linearGradient id="wash" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#222d22"/><stop offset="1" stop-color="#111810"/></linearGradient></defs>
<rect width="1200" height="675" fill="url(#wash)"/><rect width="1200" height="675" fill="url(#grid)"/>
<text x="70" y="78" fill="#d9ee9a" font-family="monospace" font-size="18" letter-spacing="4">CALIFORNIA / TRAFFIC SAFETY DATA</text>
<text x="70" y="142" fill="#f3f0e4" font-family="Arial,sans-serif" font-size="52" font-weight="700">From records to patterns.</text>
